# Pubblica il sito su SiteGround via SSH a ogni modifica di public/ sul ramo main.
# Segreti (Settings > Secrets and variables > Actions): vedi README.md.
name: Pubblica su SiteGround

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: siteground
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: fabio.treart-evolution.com
      REPORT: ${{ github.workspace }}/esito-pubblicazione.txt
    steps:
      - uses: actions/checkout@v4

      - name: Carica i file su SiteGround
        env:
          SG_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          SG_PASS: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
          SG_HOST: ${{ secrets.SITEGROUND_HOST }}
          SG_USER: ${{ secrets.SITEGROUND_USER }}
          SG_PORT: ${{ secrets.SITEGROUND_PORT }}
          SG_DIR: ${{ vars.SITEGROUND_DIR }}
        run: bash .github/scripts/pubblica.sh

      - name: Controlla il sito online
        run: bash .github/scripts/controlla.sh

      - name: Salva l'esito nel ramo esito-pubblicazione
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f "$REPORT" ] || echo "Nessun esito registrato" > "$REPORT"
          echo "Esito complessivo: $JOB_STATUS" >> "$REPORT"
          dir=$(mktemp -d)
          cp "$REPORT" "$dir/"
          cd "$dir"
          git init -q -b esito-pubblicazione
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Esito pubblicazione n. $GITHUB_RUN_NUMBER"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:esito-pubblicazione
